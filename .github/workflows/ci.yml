name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    name: Image impact
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      profiles: ${{ steps.plan.outputs.profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { assessCI, assessRelease } = await import(process.cwd() + '/scripts/lib/image-changes.mjs');
            const { readCatalog } = await import(process.cwd() + '/scripts/quay-release.mjs');
            const result = await assessCI({ github, context, assessReleaseForCI: async sourceCommit => {
              const {data:repo} = await github.rest.repos.get(context.repo);
              const records = await readCatalog(github, context.repo, repo.default_branch);
              return assessRelease({ github, repo:context.repo, sourceCommit, records });
            }});
            core.setOutput('build', result.profiles.length > 0);
            core.setOutput('profiles', JSON.stringify(result.profiles.length ? result.profiles : ['core']));
            if (result.profiles.length) {
              const {spawnSync} = require('node:child_process');
              if (spawnSync(process.execPath,['scripts/platform.mjs','bases'],{stdio:'inherit'}).status !== 0) throw Error('Pinned base architecture coverage failed');
            }
            await core.summary.addHeading('Image work decision').addRaw(result.reason + '\n\n').addCodeBlock(JSON.stringify(result.profiles),'json').write();
  static:
    name: Static checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check policy, scripts, and whitespace
        run: |
          node --test tests/*.test.cjs
          node --check scripts/aws-dependencies.mjs
          node --check scripts/verify-external.mjs
          node --check tests/keycloak-protocol.mjs
          node --check scripts/upstream-update.mjs
          node --check scripts/scan-image.mjs
          node --check scripts/trivy-comment.mjs
          node --check scripts/trivy-gate.mjs
          node --check scripts/quay-release.mjs
          node --check scripts/release-catalog.mjs
          node --check scripts/release-image.mjs
          node --check scripts/lib/quay-auth.mjs
          node --check scripts/lib/image-changes.mjs
          node scripts/releases.mjs render --check
          node scripts/check-upstream-compatibility.mjs
          shellcheck scripts/*.sh
          git show --format= --check HEAD
  build:
    name: Build ${{ matrix.profile }} (${{ matrix.architecture }})
    needs: impact
    if: needs.impact.outputs.build == 'true'
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.impact.outputs.profiles) }}
        architecture: [amd64, arm64]
    env:
      BUILD_PROFILE: ${{ matrix.profile }}
      BUILD_ARCH: ${{ matrix.architecture }}
      SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      # runner context is available in steps, not in job-level env.
      - name: Use disk-backed OCI temporary storage
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install open-source OCI tools
        run: |
          cat /etc/os-release
          findmnt -T "$TMPDIR" -o TARGET,FSTYPE,SIZE,AVAIL
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y buildah podman skopeo openssl
          buildah --version
          podman --version
          skopeo --version
      - name: Build OCI image with Buildah
        id: build_image
        run: bash scripts/build.sh
      - name: Export OCI layout and archive
        id: export_image
        run: |
          mkdir -p dist .cache/trivy-image
          buildah push localhost/rambow-keycloak:test oci:.cache/trivy-image
          skopeo copy oci:.cache/trivy-image oci-archive:dist/keycloak.oci.tar
          cp images.lock.json dist/
          if [ "$BUILD_PROFILE" = aws ]; then cp dependencies/aws/dependencies.lock.json dist/; fi
      - name: Verify distroless image against PostgreSQL
        run: bash scripts/verify-image.sh
      - name: Scan built image with checksum-pinned Trivy
        id: scan
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        run: node scripts/scan-image.mjs .cache/trivy-image .cache/trivy-report
      - name: Upload vulnerability reports before enforcing the gate
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.profile }}-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: .cache/trivy-report/
          retention-days: 7
          if-no-files-found: error
      - name: Checksum OCI archive
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        working-directory: dist
        run: sha256sum keycloak.oci.tar > keycloak.oci.tar.sha256
      - name: Verify the exported release archive contract
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        run: |
          node scripts/release-image.mjs inspect-ci dist
          cp .cache/trivy-report/summary.json dist/scan-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        with:
          name: keycloak-oci-${{ matrix.profile }}-${{ matrix.architecture }}-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Enforce vulnerability policy
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        run: node scripts/trivy-gate.mjs .cache/trivy-report/summary.json
  package:
    name: Package ${{ matrix.profile }} architectures
    needs: [impact, build]
    if: needs.impact.outputs.build == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.impact.outputs.profiles) }}
    env:
      BUILD_PROFILE: ${{ matrix.profile }}
      SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: keycloak-oci-${{ matrix.profile }}-*-${{ github.sha }}
          path: .cache/native-images
      - name: Install native OCI client
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
      - name: Package verified architecture images without emulation
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/package-images.mjs .cache/native-images dist
      - name: Inspect packaged OCI index contract
        env:
          TMPDIR: ${{ runner.temp }}
        run: node scripts/release-image.mjs inspect-ci dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keycloak-oci-${{ matrix.profile }}-multiarch-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  verify:
    name: Build and verify
    if: always()
    needs: [impact, static, build, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Require static checks and both image profiles
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          EXPECT_BUILD: ${{ needs.impact.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
            PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$STATIC_RESULT" = success
          test "$IMPACT_RESULT" = success
          if [ "$EXPECT_BUILD" = true ]; then
            test "$BUILD_RESULT" = success
            test "$PACKAGE_RESULT" = success
          else
            test "$EXPECT_BUILD" = false
            test "$BUILD_RESULT" = skipped
            test "$PACKAGE_RESULT" = skipped
          fi
