name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      comparison_source_run:
        description: Reuse immutable OCI artifacts from an earlier run of this retained experiment (no rebuild)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  impact:
    if: ${{ !inputs.comparison_source_run }}
    name: Image impact
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      profiles: ${{ steps.plan.outputs.profiles }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { assessCI, assessRelease } = await import(process.cwd() + '/scripts/lib/image-changes.mjs');
            const { readCatalog } = await import(process.cwd() + '/scripts/quay-release.mjs');
            const result = await assessCI({ github, context, assessReleaseForCI: async sourceCommit => {
              const {data:repo} = await github.rest.repos.get(context.repo);
              const records = await readCatalog(github, context.repo, repo.default_branch);
              return assessRelease({ github, repo:context.repo, sourceCommit, records });
            }});
            core.setOutput('build', result.profiles.length > 0);
            core.setOutput('profiles', JSON.stringify(result.profiles.length ? result.profiles : ['core']));
            await core.summary.addHeading('Image work decision').addRaw(result.reason + '\n\n').addCodeBlock(JSON.stringify(result.profiles),'json').write();
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check policy, scripts, and whitespace
        run: |
          node --test tests/*.test.cjs
          node --check scripts/aws-dependencies.mjs
          node --check scripts/verify-external.mjs
          node --check tests/keycloak-protocol.mjs
          node --check scripts/upstream-update.mjs
          node --check scripts/scan-image.mjs
          node --check scripts/trivy-comment.mjs
          node --check scripts/trivy-gate.mjs
          node --check scripts/quay-release.mjs
          node --check scripts/release-catalog.mjs
          node --check scripts/release-image.mjs
          node --check scripts/lib/quay-auth.mjs
          node --check scripts/lib/image-changes.mjs
          node --check docs/experiments/ubi10-grype/prepare.mjs
          node --check docs/experiments/ubi10-grype/compare.mjs
          node scripts/releases.mjs render --check
          node scripts/check-upstream-compatibility.mjs
          shellcheck scripts/*.sh
          shellcheck docs/experiments/ubi10-grype/*.sh
          git show --format= --check HEAD
  build:
    name: Build ${{ matrix.profile }}
    needs: impact
    if: needs.impact.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.impact.outputs.profiles) }}
    env:
      BUILD_PROFILE: ${{ matrix.profile }}
      SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install open-source OCI tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y buildah podman skopeo openssl
          buildah --version
          podman --version
          skopeo --version
      - name: Build OCI image with Buildah
        id: build_image
        run: bash scripts/build.sh
      - name: Export OCI layout and archive
        id: export_image
        run: |
          mkdir -p dist .cache/trivy-image
          buildah push localhost/rambow-keycloak:test oci:.cache/trivy-image
          skopeo copy oci:.cache/trivy-image oci-archive:dist/keycloak.oci.tar
          cp images.lock.json dist/
          if [ "$BUILD_PROFILE" = aws ]; then cp dependencies/aws/dependencies.lock.json dist/; fi
      - name: Verify distroless image against PostgreSQL
        run: bash scripts/verify-image.sh
      - name: Scan built image with checksum-pinned Trivy
        id: scan
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        run: node scripts/scan-image.mjs .cache/trivy-image .cache/trivy-report
      - name: Upload vulnerability reports before enforcing the gate
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.profile }}-${{ github.run_attempt }}
          path: .cache/trivy-report/
          retention-days: 7
          if-no-files-found: error
      - name: Checksum OCI archive
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        working-directory: dist
        run: sha256sum keycloak.oci.tar > keycloak.oci.tar.sha256
      - name: Verify the exported release archive contract
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        run: node scripts/release-image.mjs inspect-ci dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        with:
          name: keycloak-oci-${{ matrix.profile }}-amd64-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Enforce vulnerability policy
        if: ${{ !cancelled() && steps.export_image.outcome == 'success' }}
        run: node scripts/trivy-gate.mjs .cache/trivy-report/summary.json
  ubi10:
    name: UBI 10 runtime candidates
    if: ${{ !inputs.comparison_source_run && startsWith(github.head_ref || github.ref_name, 'chore/50-ubi10-grype-comparison') }}
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install open-source OCI tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y buildah podman skopeo openssl
      - name: Build and verify UBI 10 core
        run: bash docs/experiments/ubi10-grype/build.sh core
      - name: Build and verify UBI 10 aws using the shared runtime cache
        if: ${{ !cancelled() }}
        run: bash docs/experiments/ubi10-grype/build.sh aws
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ubi10-oci-core-amd64-${{ github.sha }}
          path: .cache/ubi10/core/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ubi10-oci-aws-amd64-${{ github.sha }}
          path: .cache/ubi10/aws/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
  grype_compare:
    name: Grype and Java comparison
    if: ${{ !cancelled() && startsWith(github.head_ref || github.ref_name, 'chore/50-ubi10-grype-comparison') }}
    needs: [static, build, ubi10]
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SCAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN: ${{ inputs.comparison_source_run }}
        with:
          script: |
            const requested = process.env.SOURCE_RUN;
            const run_id = requested ? Number(requested) : context.runId;
            if (!Number.isSafeInteger(run_id) || run_id < 1) throw Error('Invalid source run');
            const { data: source } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id });
            if (source.head_repository.full_name !== 'rambow-cloud/keycloak' || source.head_branch !== 'chore/50-ubi10-grype-comparison' ||
                source.path !== '.github/workflows/ci.yml') throw Error('Unrelated artifact source');
            if (requested) {
              const { data: diff } = await github.rest.repos.compareCommits({ ...context.repo, base: source.head_sha, head: context.sha });
              const allowed = new Set(['docs/experiments/ubi10-grype/compare.mjs', 'tests/ubi10-grype.test.cjs', '.github/workflows/ci.yml']);
              if (!['ahead', 'identical'].includes(diff.status) || !diff.files || diff.files.some(f => !allowed.has(f.filename) || f.previous_filename)) {
                throw Error('Only comparison/report orchestration changes can reuse source artifacts');
              }
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id, per_page: 100 });
            const images = artifacts.filter(a => /^(keycloak|ubi10)-oci-(core|aws)-amd64-[a-f0-9]{40}$/.test(a.name));
            const shas = new Set(images.map(a => a.name.slice(-40)));
            if (images.length !== 4 || shas.size !== 1 || images.some(a => a.expired)) throw Error('Incomplete/expired source image set');
            const sha = [...shas][0];
            for (const runtime of ['keycloak','ubi10']) for (const profile of ['core','aws']) {
              if (images.filter(a => a.name === runtime + '-oci-' + profile + '-amd64-' + sha).length !== 1) throw Error('Duplicate/missing source profile');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { ...context.repo, run_id, filter: 'latest', per_page: 100 });
            const baseline = ['Build core','Build aws'].every(name => jobs.some(j => j.name === name && j.conclusion === 'success'));
            core.setOutput('run', String(run_id)); core.setOutput('sha', sha); core.setOutput('baseline', baseline ? 'success' : 'failure');
            await core.summary.addRaw('Using the four immutable OCI artifacts from run ' + run_id + ' at image source ' + sha + '. No image rebuild is claimed by a comparison-only recovery.\n').write();
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-oci-*-amd64-${{ steps.binding.outputs.sha }}'
          path: .cache/comparison-inputs/
          run-id: ${{ steps.binding.outputs.run }}
          github-token: ${{ github.token }}
      - name: Install rootless OCI inspection/runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y podman skopeo
      - name: Scan four exact artifacts with one Grype database and probe actual JVMs
        env:
          ARTIFACT_SOURCE_SHA: ${{ steps.binding.outputs.sha }}
          ARTIFACT_SOURCE_RUN: ${{ steps.binding.outputs.run }}
          BASELINE_RESULT: ${{ steps.binding.outputs.baseline }}
        run: node docs/experiments/ubi10-grype/compare.mjs
      - name: Preserve complete comparison before its gate result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ubi10-grype-java-comparison-${{ github.run_attempt }}
          path: |
            .cache/ubi10-grype-report/
            !.cache/ubi10-grype-report/tools/
            !.cache/ubi10-grype-report/probe/
            !.cache/ubi10-grype-report/control-vulnerable/
            !.cache/ubi10-grype-report/control-fixed/
          retention-days: 7
          if-no-files-found: error
  verify:
    name: Build and verify
    if: always()
    needs: [impact, static, build, ubi10, grype_compare]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require static checks and both image profiles
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          IMPACT_RESULT: ${{ needs.impact.result }}
          EXPECT_BUILD: ${{ needs.impact.outputs.build }}
          BUILD_RESULT: ${{ needs.build.result }}
          EXPERIMENT: ${{ startsWith(github.head_ref || github.ref_name, 'chore/50-ubi10-grype-comparison') }}
          UBI_RESULT: ${{ needs.ubi10.result }}
          GRYPE_RESULT: ${{ needs.grype_compare.result }}
          RECOVERY: ${{ inputs.comparison_source_run != '' }}
        run: |
          test "$STATIC_RESULT" = success
          if [ "$RECOVERY" = true ]; then
            test "$EXPERIMENT" = true
            test "$GRYPE_RESULT" = success
            exit 0
          fi
          test "$IMPACT_RESULT" = success
          if [ "$EXPECT_BUILD" = true ]; then
            test "$BUILD_RESULT" = success
          else
            test "$EXPECT_BUILD" = false
            test "$BUILD_RESULT" = skipped
          fi
          if [ "$EXPERIMENT" = true ]; then
            test "$UBI_RESULT" = success
            test "$GRYPE_RESULT" = success
          fi
