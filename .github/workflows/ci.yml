name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check issue policy and whitespace
        run: |
          node --test tests/issue-policy.test.cjs
          git show --format= --check HEAD
      - name: Install open-source OCI tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y buildah podman skopeo shellcheck
          buildah --version
          podman --version
          skopeo --version
      - name: Check shell scripts
        run: shellcheck scripts/*.sh
      - name: Build OCI image with Buildah
        run: bash scripts/build.sh
      - name: Verify distroless image against PostgreSQL
        run: bash scripts/verify-image.sh
      - name: Export OCI archive
        run: |
          mkdir -p dist
          buildah push localhost/rambow-keycloak:test oci-archive:dist/keycloak.oci.tar
          cp images.lock.json dist/
      - name: Checksum OCI archive
        working-directory: dist
        run: sha256sum keycloak.oci.tar > keycloak.oci.tar.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keycloak-oci-amd64-${{ github.sha }}
          path: dist/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

