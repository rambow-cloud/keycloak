name: Issue policy
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
permissions:
  contents: read
  issues: read
concurrency:
  group: issue-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    name: Issue policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out the PR head in pull_request_target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { checkPullRequest } = require(process.cwd() + '/scripts/issue-policy.cjs');
            await checkPullRequest({ github, context });

