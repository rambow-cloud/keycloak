name: Issue policy
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open local PR whose exact head should receive this policy check
        required: true
        type: string
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: issue-policy-${{ github.event.pull_request.number || inputs.pull_request_number }}
  cancel-in-progress: true
jobs:
  policy:
    name: Issue policy
    # Merge closes linked Issues; later description edits must not revalidate them as open work.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.state == 'open'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out the PR head in pull_request_target.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const policy = require(process.cwd() + '/scripts/issue-policy.cjs');
            if (context.eventName === 'workflow_dispatch') {
              await policy.checkDispatchedPullRequest({ github, context, number: process.env.PR_NUMBER });
            } else {
              await policy.checkPullRequest({ github, context });
            }
