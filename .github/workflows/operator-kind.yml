name: Operator kind experiment
on:
  push:
    branches: [chore/154-operator-kind]
    paths:
      - .github/workflows/operator-kind.yml
      - docs/experiments/operator-kind/**
      - tests/operator-kind.test.cjs
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: operator-kind-${{ github.ref }}
  cancel-in-progress: false
jobs:
  operator:
    name: Operator (${{ matrix.architecture }})
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    env:
      BUILD_ARCH: ${{ matrix.architecture }}
      KIND_EXPERIMENTAL_PROVIDER: podman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Podman and test infrastructure tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman openssl
      - name: Run pinned kind and matching Operator against published images
        run: |
          sudo env PATH="$PATH" KIND_EXPERIMENTAL_PROVIDER=podman \
            BUILD_ARCH="$BUILD_ARCH" GITHUB_SHA="$GITHUB_SHA" GITHUB_REF_NAME="$GITHUB_REF_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            node docs/experiments/operator-kind/run.mjs
      - name: Display compatibility results
        if: ${{ !cancelled() }}
        run: |
          if [ -f .cache/operator-kind/evidence/summary.md ]; then
            cat .cache/operator-kind/evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain sanitized architecture-bound experiment evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: operator-kind-${{ matrix.architecture }}-${{ github.run_attempt }}
          path: .cache/operator-kind/evidence/
          if-no-files-found: error
          retention-days: 30
