name: Distroless runtime release
on:
  workflow_run:
    workflows: [CI, Quay release]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful main CI run ID, or successful formal Quay release run ID
        type: string
        required: true
      release_tag:
        description: Optional formal Release tag for documentation after main-only Quay recovery
        type: string
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-release-processing
  cancel-in-progress: false
jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.path == '.github/workflows/release.yml' ||
        (github.event.workflow_run.path == '.github/workflows/ci.yml' &&
         github.event.workflow_run.head_branch == github.event.repository.default_branch &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      prepared: ${{ steps.prepare.outputs.prepared }}
      active: ${{ steps.prepare.outputs.active }}
      mode: ${{ steps.prepare.outputs.mode }}
      source_run: ${{ steps.prepare.outputs.source_run }}
      artifacts: ${{ steps.prepare.outputs.artifacts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN: ${{ github.event.workflow_run.id || inputs.source_run }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        with:
          script: |
            const {prepareRuntimeRelease}=await import(process.cwd()+'/scripts/runtime-release.mjs');
            if(!/^[1-9][0-9]*$/.test(process.env.SOURCE_RUN)) throw Error('A valid source run is required');
            const prepared=await prepareRuntimeRelease({github,context,runId:Number(process.env.SOURCE_RUN),releaseTag:process.env.RELEASE_TAG||undefined});
            core.setOutput('prepared',JSON.stringify(prepared));core.setOutput('active',!prepared.skip);
            core.setOutput('mode',prepared.mode??'');core.setOutput('source_run',prepared.sourceRun?.id??'');
            core.setOutput('artifacts',prepared.selected?.map(a=>a.id).join(',')??'');
            await core.summary.addHeading('Distroless update decision').addCodeBlock(JSON.stringify(prepared,null,2),'json').write();
  process:
    needs: prepare
    if: needs.prepare.outputs.active == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: upstream-update
    # Do not occupy/cancel the publisher's concurrency slot while emitting events.
    concurrency:
      group: runtime-formal-release
      cancel-in-progress: false
    env:
      PREPARED: ${{ needs.prepare.outputs.prepared }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.prepare.outputs.mode == 'release'
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifacts }}
          path: .cache/runtime-pairs
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.source_run }}
      - name: Validate paired evidence with a read-only token
        if: needs.prepare.outputs.mode == 'release'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {readPairs,buildRuntimeReport} from './scripts/runtime-release.mjs';
          const p=JSON.parse(process.env.PREPARED),policy=JSON.parse(await fs.readFile('config/trivy.json','utf8'));
          const report=buildRuntimeReport(p,await readPairs(p,'.cache/runtime-pairs'),policy);
          await fs.writeFile('.cache/runtime-comparison.json',JSON.stringify(report,null,2)+'\n');
          NODE
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23li88vLKtqCEQifBK
          private-key: ${{ secrets.UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Create a formal Release or a reviewed publication-report PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MINTED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          READ_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const {updaterApp,validateUpdaterApp,sameUpdater}=await import(process.cwd()+'/scripts/lib/upstream.mjs');
            const app=validateUpdaterApp(updaterApp,process.env.MINTED_APP_SLUG);
            const {data:identity}=await github.rest.users.getByUsername({username:app.bot.login});
            if(!sameUpdater(identity,app.bot)) throw Error('Pinned updater App identity changed');
            const {createRuntimeRelease,createRuntimeDocumentation}=await import(process.cwd()+'/scripts/runtime-release.mjs');
            const prepared=JSON.parse(process.env.PREPARED);
            const validationGithub=new github.constructor({auth:process.env.READ_TOKEN});
            const result=prepared.mode==='release' ? await createRuntimeRelease({github,validationGithub,context,prepared,identity,
              report:JSON.parse(await require('node:fs/promises').readFile('.cache/runtime-comparison.json','utf8'))}) :
              await createRuntimeDocumentation({github,context,prepared,identity});
            await core.summary.addHeading('Distroless update result').addCodeBlock(JSON.stringify(result,null,2),'json').write();
      - name: Retain frozen comparison even if Release creation fails
        if: ${{ !cancelled() && needs.prepare.outputs.mode == 'release' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-comparison-${{ github.run_attempt }}
          path: .cache/runtime-comparison.json
          retention-days: 30
          if-no-files-found: error
