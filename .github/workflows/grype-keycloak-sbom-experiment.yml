name: Keycloak Grype SBOM experiment

on:
  push:
    branches: [chore/140-grype-keycloak-sbom]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    if: github.ref == 'refs/heads/chore/140-grype-keycloak-sbom'
    name: Scan published Keycloak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            grype-sha256: 9c8965ced9df657e5e851c14021bae838802f711edd7a48f9bc3c923a8d28f12
            syft-sha256: 9c077a7d43029b3b13e98a8db720661e700c4d58db6352153a06395ae4a2a704
          - arch: arm64
            runner: ubuntu-26.04-arm
            grype-sha256: d7d2e160255b0f087280feabf6f213cf4c45d475690f3f1fe5dc336eb1037bf0
            syft-sha256: 410cbfa0ae0f63246bc0057843760b1de2833cd23919e025e368fd7681308cdb
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      PROBE_ARCH: ${{ matrix.arch }}
      GRYPE_SHA256: ${{ matrix.grype-sha256 }}
      SYFT_SHA256: ${{ matrix.syft-sha256 }}
      GRYPE_CHECK_FOR_APP_UPDATE: 'false'
      SYFT_CHECK_FOR_APP_UPDATE: 'false'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Skopeo if absent
        run: |
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y skopeo
          fi
      - name: Scan the published core and aws child images
        run: node experiments/grype-keycloak-sbom.mjs
      - name: Retain digest bindings, SBOMs, and scanner evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-keycloak-${{ matrix.arch }}-${{ github.run_attempt }}
          path: .cache/grype-keycloak-sbom/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
