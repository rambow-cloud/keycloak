name: Trivy PR comment
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed PR CI run ID to report (no image rebuild)
        type: string
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
concurrency:
  group: trivy-pr-comments
  cancel-in-progress: false
jobs:
  comment:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only trusted default-branch code may run with the comment-writing token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        with:
          script: |
            const { prepareReport } = await import(process.cwd() + '/scripts/trivy-comment.mjs');
            const prepared = await prepareReport({ github, context, core, runId: process.env.RUN_ID });
            core.setOutput('prepared', JSON.stringify(prepared));
            core.setOutput('artifact_ids', prepared?.artifacts.map(a => a.id).join(',') ?? '');
            core.setOutput('run_id', prepared?.run.id ?? '');
      # Artifacts are data only; download outside the source checkout and never execute them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.prepare.outputs.artifact_ids != ''
        with:
          artifact-ids: ${{ steps.prepare.outputs.artifact_ids }}
          path: ${{ runner.temp }}/trivy-reports
          merge-multiple: false
          github-token: ${{ github.token }}
          run-id: ${{ steps.prepare.outputs.run_id }}
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: steps.prepare.outputs.run_id != ''
        env:
          PREPARED: ${{ steps.prepare.outputs.prepared }}
          REPORT_DIRECTORY: ${{ runner.temp }}/trivy-reports
        with:
          script: |
            const { publishReport } = await import(process.cwd() + '/scripts/trivy-comment.mjs');
            await publishReport({ github, context, core, prepared: JSON.parse(process.env.PREPARED), directory: process.env.REPORT_DIRECTORY });
