name: "Bug report"
description: "Report a reproducible image, build, or runtime failure."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Use English. Complete every section before implementation. Never include secrets or undisclosed vulnerability details."
  - type: textarea
    id: problem
    attributes:
      label: "Problem description"
      description: "Describe the failure and its impact."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Reproduction steps"
      description: "Provide minimal, ordered steps without secrets."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "Describe what should happen."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "Describe what happened instead."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Include image tag/digest, Keycloak version, architecture, Buildah/Podman versions, database version, and deployment environment."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Sanitized logs"
      description: "Include relevant redacted logs, or explain why no logs are available."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "List the observable outcomes required to consider this fixed."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Validation plan"
      description: "Explain how to reproduce the failure and verify the fix."
    validations:
      required: true

